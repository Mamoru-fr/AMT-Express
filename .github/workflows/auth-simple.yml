name: Auth Integration (Simple)

on:
  push:
    branches: [ main, development, feature/** ]
    paths:
      - 'amt-express/**'
      - '.github/workflows/**'
  pull_request:
    branches: [ main, development, feature/** ]
    paths:
      - 'amt-express/**'
      - '.github/workflows/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/amt_express_test

jobs:
  test:
    name: Auth Integration Test (Simple)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: amt_express_test
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        run: npm install -g pnpm@9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: '**/pnpm-lock.yaml'

      - name: Install dependencies
        working-directory: ./amt-express
        run: |
          pnpm install --frozen-lockfile --ignore-scripts

      - name: Configure Drizzle for CI
        working-directory: ./amt-express
        run: |
          cp lib/db/drizzle.ts lib/db/drizzle.ts.backup 2>/dev/null || true
          cat > lib/db/drizzle.ts << 'EOF'
          import * as schema from "@/lib/db/schema";
          import { drizzle } from "drizzle-orm/postgres-js";
          import postgres from "postgres";

          const connectionString = process.env.DATABASE_URL;
          if (!connectionString) {
            throw new Error("DATABASE_URL is not set");
          }

          const sql = postgres(connectionString, {
            max: 1,
            idle_timeout: 20,
            connect_timeout: 30,
          });

          const db = drizzle(sql, { schema });
          export default db;
          EOF

      - name: Run migrations
        working-directory: ./amt-express
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
        run: pnpm db:migrate

      - name: Restore Drizzle configuration
        if: always()
        working-directory: ./amt-express
        run: |
          if [ -f lib/db/drizzle.ts.backup ]; then
            mv lib/db/drizzle.ts.backup lib/db/drizzle.ts
          fi

      - name: Run single auth integration test
        working-directory: ./amt-express
        env:
          NODE_ENV: test
          DATABASE_URL: ${{ env.DATABASE_URL }}
          CSRF_SECRET: test-secret
        run: pnpm test:auth-simple --run --test-timeout=60000
