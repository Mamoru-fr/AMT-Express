name: CI - Build, Test & Docker

on:
  push:
    branches: [ main, development, feature/** , feature/github-workflows]
  pull_request:
    branches: [ main, development, feature/github-workflows]

env:
  NODE_VERSION: '24.7.0'
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: 'false'
  BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: amt_express_test
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enable Corepack
        run: corepack enable

      # Setup Node.js with pnpm via corepack
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: '**/pnpm-lock.yaml'

      - name: Ensure pnpm is available
        run: corepack prepare pnpm@latest --activate

      - name: Install dependencies
        working-directory: ./amt-express
        run: |
          # Configure pnpm for CI (pnpm v9+ uses pnpm-workspace.yaml)
          echo 'autoInstallPeers: true' >> pnpm-workspace.yaml
          echo 'strictPeerDependencies: false' >> pnpm-workspace.yaml
          pnpm install --frozen-lockfile --ignore-scripts

      - name: Configure Drizzle for PostgreSQL (CI)
        working-directory: ./amt-express
        run: |
          # Backup original drizzle.ts
          cp lib/db/drizzle.ts lib/db/drizzle.ts.backup
          
          # Create CI version using postgres-js
          cat > lib/db/drizzle.ts << 'EOF'
          import * as dotenv from "dotenv";
          import * as schema from "@/lib/db/schema";
          import { drizzle } from "drizzle-orm/postgres-js";
          import postgres from "postgres";
          
          dotenv.config();
          
          const connectionString = process.env.DATABASE_URL;
          if (!connectionString) {
              throw new Error("DATABASE_URL environment variable is not set");
          }
          
          const sql = postgres(connectionString, {
              max: 1,
              idle_timeout: 20,
              connect_timeout: 10,
          });
          
          const db = drizzle(sql, { schema });
          
          console.log('✅ Database connection initialized for CI');
          
          export default db;
          EOF

      - name: Run database migrations
        working-directory: ./amt-express
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/amt_express_test
        run: pnpm db:generate

      # Linting
      - name: Run ESLint
        working-directory: ./amt-express
        run: pnpm lint

      # Build the application
      - name: Build Next.js application
        working-directory: ./amt-express
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/amt_express_test
          CSRF_SECRET: test-secret
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
        run: pnpm build

      # Run tests
      - name: Run tests
        working-directory: ./amt-express
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/amt_express_test
          CSRF_SECRET: test-secret
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
        run: pnpm test:run

      - name: Restore original drizzle.ts
        if: always()
        working-directory: ./amt-express
        run: |
          # Restore original file after tests
          if [ -f lib/db/drizzle.ts.backup ]; then
            mv lib/db/drizzle.ts.backup lib/db/drizzle.ts
          fi

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: build-and-test
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_HUB_USERNAME || 'ghcr.io' }}/amt-express
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./amt-express
          file: ./amt-express/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            DATABASE_URL=postgresql://user:pass@localhost:5432/db
            CSRF_SECRET=build-secret-placeholder
            BETTER_AUTH_SECRET=${{ secrets.BETTER_AUTH_SECRET }}
