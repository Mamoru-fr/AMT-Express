name: Authentication Tests

on:
  push:
    branches: [ main, development, feature/** ]
    paths:
      - 'amt-express/**'
      - '.github/workflows/**'
  pull_request:
    branches: [ main, development, feature/** ]
    paths:
      - 'amt-express/**'
      - '.github/workflows/**'
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  setup:
    name: Setup
    outputs:
      branch: ${{ steps.branch_name.outputs.current_branch }}
    runs-on: ubuntu-latest
    steps:
      - name: Get branch name
        id: branch_name
        uses: tj-actions/branch-names@v8
  
  create_neon_branch:
    name: Create Neon Branch
    outputs:
      db_url: ${{ steps.create_neon_branch_encode.outputs.db_url }}
      db_url_with_pooler: ${{ steps.create_neon_branch_encode.outputs.db_url_with_pooler }}
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - name: Get branch expiration date as an env variable (2 weeks from now)
        id: get_expiration_date
        run: echo "EXPIRES_AT=$(date -u --date '+14 days' +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"
      - name: Create Neon Branch
        id: create_neon_branch
        uses: neondatabase/create-branch-action@v6
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch_name: preview/pr-${{ github.event.number }}-${{ needs.setup.outputs.branch }}
          api_key: ${{ secrets.NEON_API_KEY }}
          expires_at: ${{ env.EXPIRES_AT }}

  integration-tests:
    name: Authentication Integration Tests (With Database)
    needs: [setup, create_neon_branch]
    env:
      DATABASE_URL: ${{ needs.create_neon_branch.outputs.db_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm globally
        run: npm install -g pnpm@9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: '**/pnpm-lock.yaml'

      - name: Install dependencies
        working-directory: ./amt-express
        run: |
          echo 'autoInstallPeers: true' >> pnpm-workspace.yaml
          echo 'strictPeerDependencies: false' >> pnpm-workspace.yaml
          pnpm install --frozen-lockfile --ignore-scripts

      - name: Verify Neon DB connection
        working-directory: ./amt-express
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
        run: |
          echo "=== [DEBUG] Testing Neon DB connection ==="
          cat > test-db-connection.mjs << 'EOF'
          import { neon } from '@neondatabase/serverless';
          (async () => {
            try {
              console.error('Testing Neon connection...');
              const sql = neon(process.env.DATABASE_URL);
              const result = await sql`SELECT 1 as test`;
              console.error('✅ Neon DB connection test: SUCCESS');
              console.error('Query result:', result);
              process.exit(0);
            } catch (error) {
              console.error('❌ Neon DB connection test: FAILED');
              console.error('Error:', error.message);
              console.error('Stack:', error.stack);
              process.exit(1);
            }
          })();
          EOF
          node test-db-connection.mjs
          rm -f test-db-connection.mjs

      - name: Run database migrations
        working-directory: ./amt-express
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
        run: pnpm db:migrate

      - name: Run Authentication tests
        working-directory: ./amt-express
        env:
          NODE_ENV: test
          DATABASE_URL: ${{ env.DATABASE_URL }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
        run: pnpm test:auth

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auth-test-results
          path: ./amt-express/test-results/
          retention-days: 7

      # - name: Restore original configuration files
      #   if: always()
      #   working-directory: ./amt-express
      #   run: |
      #     echo "Restoring original configuration files..."
      #     if [ -f lib/db/drizzle.ts.backup ]; then
      #       mv lib/db/drizzle.ts.backup lib/db/drizzle.ts
      #       echo "Restored drizzle.ts"
      #     fi
      #     if [ -f lib/auth/auth.ts.backup ]; then
      #       mv lib/auth/auth.ts.backup lib/auth/auth.ts
      #       echo "Restored auth.ts"
      #     fi
  delete_neon_branch:
    name: Delete Neon Branch
    needs: [setup, create_neon_branch, integration-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Delete Neon Branch
        uses: neondatabase/delete-branch-action@v3
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch: preview/pr-${{ github.event.number }}-${{ needs.setup.outputs.branch }}
          api_key: ${{ secrets.NEON_API_KEY }}