name: Authentication Tests

on:
  push:
    branches: [ main, development, feature/** ]
    paths:
      - 'amt-express/**'
      - '.github/workflows/**'
  pull_request:
    branches: [ main, development, feature/** ]
    paths:
      - 'amt-express/**'
      - '.github/workflows/**'
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24.7.0'
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: 'false'
  NODE_ENV: test

jobs:
  integration-tests:
    name: Authentication Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: amt_express_test
          PGUSER: postgres
          PGPASSWORD: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 15
    
    steps:
      - name: Set DATABASE_URL globally
        run: echo "DATABASE_URL=postgresql://postgres:postgres@localhost:5432/amt_express_test" >> $GITHUB_ENV

      - name: Wait for PostgreSQL to be ready
        run: |
          echo "=== Waiting for PostgreSQL ==="
          until pg_isready -h localhost -p 5432 -U postgres -d amt_express_test; do
            sleep 1
          done
          echo "✅ PostgreSQL is ready!"

      - name: Verify PostgreSQL connection
        run: |
          echo "=== Verifying PostgreSQL connection ==="
          PGPASSWORD=postgres psql -h localhost -p 5432 -U postgres -d amt_express_test -c "SELECT 1 as test;"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: '**/pnpm-lock.yaml'

      - name: Install pnpm globally
        run: npm install -g pnpm@9

      - name: Install dependencies
        working-directory: ./amt-express
        run: |
          echo "=== [DEBUG] Installing dependencies ==="
          echo 'autoInstallPeers: true' >> pnpm-workspace.yaml
          echo 'strictPeerDependencies: false' >> pnpm-workspace.yaml
          corepack pnpm install --frozen-lockfile --ignore-scripts
          echo "=== [DEBUG] Dependencies installed ==="

      - name: Configure Drizzle for PostgreSQL (CI)
        working-directory: ./amt-express
        run: |
          echo "=== [DEBUG] Creating CI drizzle.ts ==="
          echo "DATABASE_URL: postgresql://postgres:postgres@localhost:5432/amt_express_test"
          # Backup original drizzle.ts
          cp lib/db/drizzle.ts lib/db/drizzle.ts.backup
          
          # Create CI version with optimized connection pool
          cat > lib/db/drizzle.ts << 'EOF'
          import * as dotenv from "dotenv";
          import * as schema from "@/lib/db/schema";
          import { drizzle } from "drizzle-orm/postgres-js";
          import postgres from "postgres";
          
          dotenv.config();
          
          const connectionString = process.env.DATABASE_URL || "postgresql://postgres:postgres@localhost:5432/amt_express_test";
          console.log('[DEBUG] Drizzle - Connection string:', connectionString);
          if (!connectionString) {
              throw new Error("DATABASE_URL environment variable is not set");
          }
          
          const sql = postgres(connectionString, {
              max: 10,                  // Increased connection pool size
              idle_timeout: 60,         // Longer idle timeout
              connect_timeout: 10,      // Connection timeout in seconds
              debug: true,             // Enable debug logging
              onnotice: (notice) => console.log('[DEBUG] PostgreSQL notice:', notice),
              onparameter: (params) => console.log('[DEBUG] PostgreSQL params:', params),
          });
          
          const db = drizzle(sql, { schema });
          console.log('[DEBUG] Drizzle - Database connection initialized for CI');
          
          export default db;
          EOF
          echo "=== [DEBUG] CI drizzle.ts created ==="

      - name: Run database migrations
        working-directory: ./amt-express
        run: |
          echo "=== [DEBUG] Running database migrations ==="
          echo "DATABASE_URL: postgresql://postgres:postgres@localhost:5432/amt_express_test"
          corepack pnpm db:migrate
          echo "=== [DEBUG] Database migrations complete ==="

      - name: Run Authentication tests
        working-directory: ./amt-express
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/amt_express_test
          CSRF_SECRET: test-secret
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
        run: |
          echo "=== [DEBUG] Starting Authentication tests ==="
          echo "DATABASE_URL: postgresql://postgres:postgres@localhost:5432/amt_express_test"
          corepack pnpm test:auth --run --test-timeout=120000
          echo "=== [DEBUG] Authentication tests complete ==="

      - name: Debug - Final PostgreSQL check
        if: always()
        run: |
          echo "=== [DEBUG] Final PostgreSQL Check ==="
          echo "Checking if PostgreSQL is still running..."
          docker ps --all --filter "name=postgres" --format "{{.Status}}"
          echo ""
          echo "=== [DEBUG] Environment Variables ==="
          echo "DATABASE_URL: ${DATABASE_URL:-not set}"
          echo "NODE_ENV: ${NODE_ENV:-not set}"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auth-test-results
          path: ./amt-express/test-results/
          retention-days: 7

      - name: Restore original drizzle.ts
        if: always()
        working-directory: ./amt-express
        run: |
          echo "=== [DEBUG] Restoring original drizzle.ts ==="
          # Restore original file after tests
          if [ -f lib/db/drizzle.ts.backup ]; then
            mv lib/db/drizzle.ts.backup lib/db/drizzle.ts
            echo "✅ Original drizzle.ts restored"
          else
            echo "⚠️ No backup file found (lib/db/drizzle.ts.backup)"
          fi
          echo "=== [DEBUG] Workflow Complete ==="