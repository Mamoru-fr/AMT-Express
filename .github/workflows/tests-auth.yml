name: Integration Tests

on:
  push:
    branches: [ main, development, feature/** ]
    paths:
      - 'amt-express/**'
      - '.github/workflows/**'
  pull_request:
    branches: [ main, development, feature/** ]
    paths:
      - 'amt-express/**'
      - '.github/workflows/**'
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24.7.0'
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: 'false'

jobs:
  integration-tests:
    name: Authentication Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: amt_express_test
          PGUSER: postgres
          PGPASSWORD: postgres
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    
    steps:
      - name: Set DATABASE_URL globally
        run: |
          echo "DATABASE_URL=postgresql://postgres:postgres@localhost:5432/amt_express_test" >> $GITHUB_ENV
      - name: Debug - Job started
        run: |
          echo "=== [DEBUG] Authentication Tests Job Started ==="
          echo "Current time: $(date)"
          echo "Runner OS: ${RUNNER_OS}"
          echo "Node version env: ${NODE_VERSION}"

      - name: Debug - Check PostgreSQL service
        run: |
          echo "=== [DEBUG] Waiting for PostgreSQL service ==="
          echo "PostgreSQL service accessible via: localhost:5432"
          echo "Expected connection string: postgresql://postgres:postgres@localhost:5432/amt_express_test"
          echo "Testing connection in 5 seconds..."
          sleep 5

      - name: Checkout
        uses: actions/checkout@v4

      - name: Debug - After checkout
        run: |
          echo "=== [DEBUG] After Checkout ==="
          echo "Current directory: $(pwd)"
          ls -la

      - name: Enable Corepack
        run: corepack enable

      - name: Debug - Corepack enabled
        run: echo "=== [DEBUG] Corepack enabled ==="

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: '**/pnpm-lock.yaml'

      - name: Debug - Node.js setup complete
        run: |
          echo "=== [DEBUG] Node.js Setup Complete ==="
          node --version
          npm --version
          pnpm --version

      - name: Ensure pnpm is available
        run: corepack prepare pnpm@latest --activate

      - name: Install dependencies
        working-directory: ./amt-express
        run: |
          echo "=== [DEBUG] Installing dependencies ==="
          # Configure pnpm for CI (pnpm v9+ uses pnpm-workspace.yaml)
          echo 'autoInstallPeers: true' >> pnpm-workspace.yaml
          echo 'strictPeerDependencies: false' >> pnpm-workspace.yaml
          pnpm install --frozen-lockfile --ignore-scripts
          echo "=== [DEBUG] Dependencies installed ==="

      - name: Configure Drizzle for PostgreSQL (CI)
        working-directory: ./amt-express
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/amt_express_test
        run: |
          echo "=== [DEBUG] Creating CI drizzle.ts ==="
          echo "DATABASE_URL: postgresql://postgres:postgres@localhost:5432/amt_express_test"
          # Backup original drizzle.ts
          cp lib/db/drizzle.ts lib/db/drizzle.ts.backup
          
          # Create CI version using postgres-js with explicit localhost connection
          cat > lib/db/drizzle.ts << 'EOF'
          import * as dotenv from "dotenv";
          import * as schema from "@/lib/db/schema";
          import { drizzle } from "drizzle-orm/postgres-js";
          import postgres from "postgres";
          
          dotenv.config();
          
          // Always use localhost for CI environment
          const connectionString = process.env.DATABASE_URL || "postgresql://postgres:postgres@localhost:5432/amt_express_test";
          console.log('🔍 [DEBUG] Connection string:', connectionString);
          if (!connectionString) {
              throw new Error("DATABASE_URL environment variable is not set");
          }
          
          const sql = postgres(connectionString, {
              max: 1,
              idle_timeout: 20,
              connect_timeout: 30, // Increased timeout for CI
              connection_init_sql: "SET application_name = 'CI-Tests'",
          });
          
          const db = drizzle(sql, { schema });
          
          console.log('✅ Database connection initialized for CI');
          
          export default db;
          EOF
          echo "=== [DEBUG] CI drizzle.ts created ==="

      - name: Debug - PostgreSQL service status
        run: |
          echo "=== [DEBUG] PostgreSQL Service Status ==="
          docker ps --all
          echo ""
          echo "Testing PostgreSQL connection..."
          pg_isready -h localhost -p 5432 -U postgres -d amt_express_test || echo "⚠️ PostgreSQL not ready yet"

      - name: Run database migrations
        working-directory: ./amt-express
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/amt_express_test
        run: |
          echo "=== [DEBUG] Running database migrations ==="
          echo "DATABASE_URL: postgresql://postgres:postgres@localhost:5432/amt_express_test"
          pnpm db:migrate
          echo "=== [DEBUG] Database migrations complete ==="

      - name: Verify PostgreSQL connection
        run: |
          echo "=== [DEBUG] Verifying PostgreSQL connection ==="
          # Test until PostgreSQL is ready (retry logic)
          MAX_ATTEMPTS=10
          ATTEMPT=1
          while [ $ATTEMPT -le $MAX_ATTEMPTS ]; do
            echo "Attempt $ATTEMPT: Testing PostgreSQL connection..."
            if PGPASSWORD=postgres psql -h localhost -p 5432 -U postgres -d amt_express_test -c "SELECT 1 as test;" 2>/dev/null; then
              echo "✅ PostgreSQL connection successful"
              break
            else
              echo "⏳ PostgreSQL not ready yet, waiting 2 seconds..."
              sleep 2
              ATTEMPT=$((ATTEMPT + 1))
            fi
          done
          
          if [ $ATTEMPT -gt $MAX_ATTEMPTS ]; then
            echo "❌ PostgreSQL connection failed after $MAX_ATTEMPTS attempts"
            exit 1
          fi

      - name: Run Authentication tests
        working-directory: ./amt-express
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/amt_express_test
          CSRF_SECRET: test-secret
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
        run: |
          echo "=== [DEBUG] Starting Authentication tests ==="
          echo "DATABASE_URL: postgresql://postgres:postgres@localhost:5432/amt_express_test"
          pnpm test:auth
          echo "=== [DEBUG] Authentication tests complete ==="

      - name: Debug - Final PostgreSQL check
        if: always()
        run: |
          echo "=== [DEBUG] Final PostgreSQL Check ==="
          echo "Checking if PostgreSQL is still running..."
          docker ps --all --filter "name=postgres" --format "{{.Status}}"
          echo ""
          echo "=== [DEBUG] Environment Variables ==="
          echo "DATABASE_URL: ${DATABASE_URL:-not set}"
          echo "NODE_ENV: ${NODE_ENV:-not set}"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auth-test-results
          path: ./amt-express/test-results/
          retention-days: 7

      - name: Restore original drizzle.ts
        if: always()
        working-directory: ./amt-express
        run: |
          echo "=== [DEBUG] Restoring original drizzle.ts ==="
          # Restore original file after tests
          if [ -f lib/db/drizzle.ts.backup ]; then
            mv lib/db/drizzle.ts.backup lib/db/drizzle.ts
            echo "✅ Original drizzle.ts restored"
          else
            echo "⚠️ No backup file found (lib/db/drizzle.ts.backup)"
          fi
          echo "=== [DEBUG] Workflow Complete ==="