name: Integration Tests - Rides

on:
  push:
    branches: [ main, develop, feature/** ]
    paths:
      - 'amt-express/test/integration/actions/RidesManagementActions.test.ts'
      - 'amt-express/lib/actions/ridesManagementActions.ts'
      - 'amt-express/lib/controllers/RidesManagementController.ts'
  pull_request:
    branches: [ main, develop, feature/** ]
    paths:
      - 'amt-express/test/integration/actions/RidesManagementActions.test.ts'
      - 'amt-express/lib/actions/ridesManagementActions.ts'
      - 'amt-express/lib/controllers/RidesManagementController.ts'
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24.7.0'
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: 'false'

jobs:
  rides-tests:
    name: Rides Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: amt_express_test
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: '**/pnpm-lock.yaml'

      - name: Ensure pnpm is available
        run: corepack prepare pnpm@latest --activate

      - name: Install dependencies
        working-directory: ./amt-express
        run: |
          # Configure pnpm for CI (pnpm v9+ uses pnpm-workspace.yaml)
          echo 'autoInstallPeers: true' >> pnpm-workspace.yaml
          echo 'strictPeerDependencies: false' >> pnpm-workspace.yaml
          pnpm install --frozen-lockfile --ignore-scripts

      - name: Configure Drizzle for PostgreSQL (CI)
        working-directory: ./amt-express
        run: |
          # Backup original drizzle.ts
          cp lib/db/drizzle.ts lib/db/drizzle.ts.backup
          
          # Create CI version using postgres-js
          cat > lib/db/drizzle.ts << 'EOF'
          import * as dotenv from "dotenv";
          import * as schema from "@/lib/db/schema";
          import { drizzle } from "drizzle-orm/postgres-js";
          import postgres from "postgres";
          
          dotenv.config();
          
          const connectionString = process.env.DATABASE_URL;
          if (!connectionString) {
              throw new Error("DATABASE_URL environment variable is not set");
          }
          
          const sql = postgres(connectionString, {
              max: 1,
              idle_timeout: 20,
              connect_timeout: 10,
          });
          
          const db = drizzle(sql, { schema });
          
          console.log('✅ Database connection initialized for CI');
          
          export default db;
          EOF

      - name: Run database migrations
        working-directory: ./amt-express
        env:
          DATABASE_URL: postgresql://postgres:postgres@postgres:5432/amt_express_test
        run: pnpm db:migrate

      - name: Wait for database to be ready
        run: sleep 10

      - name: Run rides tests
        working-directory: ./amt-express
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://postgres:postgres@postgres:5432/amt_express_test
          CSRF_SECRET: test-secret
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
        run: pnpm test:rides

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rides-test-results
          path: ./amt-express/test-results/
          retention-days: 7

      - name: Restore original drizzle.ts
        if: always()
        working-directory: ./amt-express
        run: |
          # Restore original file after tests
          if [ -f lib/db/drizzle.ts.backup ]; then
            mv lib/db/drizzle.ts.backup lib/db/drizzle.ts
          fi