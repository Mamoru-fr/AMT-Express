name: Integration Tests - Rides

on:
  push:
    branches: [ main, development, feature/** ]
    paths:
      - 'amt-express/**'
      - '.github/workflows/**'
  pull_request:
    branches: [ main, development, feature/** ]
    paths:
      - 'amt-express/**'
      - '.github/workflows/**'
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: 'true'
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/amt_express_test

jobs:
  rides-tests:
    name: Rides Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: amt_express_test
          PGUSER: postgres
          PGPASSWORD: postgres
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 15
    
    steps:
      - name: Wait for PostgreSQL to be ready
        run: |
          echo "Waiting for PostgreSQL..."
          until pg_isready -h localhost -p 5432 -U postgres -d amt_express_test; do
            sleep 1
          done
          echo "PostgreSQL is ready!"

      - name: Verify PostgreSQL connection
        run: |
          echo "Verifying PostgreSQL connection..."
          PGPASSWORD=postgres psql -h localhost -p 5432 -U postgres -d amt_express_test -c "SELECT 1 as test;"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm globally
        run: npm install -g pnpm@9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: '**/pnpm-lock.yaml'

      - name: Install dependencies
        working-directory: ./amt-express
        run: |
          echo 'autoInstallPeers: true' >> pnpm-workspace.yaml
          echo 'strictPeerDependencies: false' >> pnpm-workspace.yaml
          pnpm install --frozen-lockfile --ignore-scripts

      - name: Configure Drizzle for PostgreSQL (CI)
        working-directory: ./amt-express
        run: |
          cp lib/db/drizzle.ts lib/db/drizzle.ts.backup
          cat > lib/db/drizzle.ts << 'ENDOFFILE'
          import * as schema from "@/lib/db/schema";
          import { drizzle } from "drizzle-orm/postgres-js";
          import postgres from "postgres";

          const connectionString = process.env.DATABASE_URL;
          if (!connectionString) {
            throw new Error("DATABASE_URL environment variable is not set");
          }

          const sql = postgres(connectionString, {
            max: 5,
            idle_timeout: 30,
            connect_timeout: 60,
          });

          const db = drizzle(sql, { schema });
          export default db;
          ENDOFFILE

      - name: Configure better-auth for CI
        working-directory: ./amt-express
        run: |
          cp lib/auth/auth.ts lib/auth/auth.ts.backup
          cat > lib/auth/auth.ts << 'ENDOFFILE'
          import { betterAuth } from "better-auth";
          import { drizzleAdapter } from "better-auth/adapters/drizzle";
          import db from "@/lib/db/drizzle";
          import * as schema from "@/lib/db/schema";
          import { nextCookies } from "better-auth/next-js";
          import { admin } from "better-auth/plugins";

          export const auth = betterAuth({
            emailAndPassword: {
              enabled: true,
            },
            database: drizzleAdapter(db, {
              provider: "pg",
              schema: {
                user: schema.users,
                session: schema.session,
                account: schema.account,
                verification: schema.verification,
              },
            }),
            plugins: [
              nextCookies(),
              admin({
                defaultRole: "customer",
              })
            ],
            secret: process.env.BETTER_AUTH_SECRET || "test-secret-fallback",
            url: process.env.BETTER_AUTH_URL || "http://localhost:3000",
          });
          ENDOFFILE
          echo "Better-auth configured for CI"

      - name: Run database migrations
        working-directory: ./amt-express
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
        run: pnpm db:migrate

      - name: Run rides tests
        working-directory: ./amt-express
        env:
          NODE_ENV: test
          DATABASE_URL: ${{ env.DATABASE_URL }}
          CSRF_SECRET: test-secret
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
        run: pnpm test:rides --run --test-timeout=120000 --hook-timeout=180000 --reporter=verbose --no-coverage

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rides-test-results
          path: ./amt-express/test-results/
          retention-days: 7

      - name: Restore original configuration files
        if: always()
        working-directory: ./amt-express
        run: |
          echo "Restoring original configuration files..."
          if [ -f lib/db/drizzle.ts.backup ]; then
            mv lib/db/drizzle.ts.backup lib/db/drizzle.ts
            echo "Restored drizzle.ts"
          fi
          if [ -f lib/auth/auth.ts.backup ]; then
            mv lib/auth/auth.ts.backup lib/auth/auth.ts
            echo "Restored auth.ts"
          fi
