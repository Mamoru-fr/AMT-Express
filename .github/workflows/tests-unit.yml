name: Unit Tests

on:
  push:
    branches: [ main, development, feature/** ]
    paths:
      - 'amt-express/test/**'
      - 'amt-express/lib/**'
  pull_request:
    branches: [ main, development, feature/** ]
    paths:
      - 'amt-express/test/**'
      - 'amt-express/lib/**'
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24.7.0'
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: 'false'

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: '**/pnpm-lock.yaml'

      - name: Ensure pnpm is available
        run: corepack prepare pnpm@latest --activate

      - name: Install dependencies
        working-directory: ./amt-express
        run: |
          # Configure pnpm for CI (pnpm v9+ uses pnpm-workspace.yaml)
          echo 'autoInstallPeers: true' >> pnpm-workspace.yaml
          echo 'strictPeerDependencies: false' >> pnpm-workspace.yaml
          pnpm install --frozen-lockfile --ignore-scripts

      - name: Run unit tests
        working-directory: ./amt-express
        env:
          NODE_ENV: test
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
        run: pnpm test:unit

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: ./amt-express/test-results/
          retention-days: 7